name: Test tools

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  install-gradle-linux-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
      - name: Check there is no Gradle installed
        run: gradle --version || exit 0
      - name: Install deps
        run: |
          apt update && apt install -y sudo wget curl openjdk-17-jdk
      - name: Install Gradle
        run: sudo bash ./tools/installGradle-8.10.1.sh
      - name: Check Gradle
        run: gradle --version
  install-gradle-windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable pre-installed Gradle
        run: choco uninstall gradle
        shell: pwsh
      - name: Check there is no Gradle installed
        shell: cmd
        run: gradle --version || exit /b 0
      - name: Install Gradle
        shell: cmd
        run: tools/installGradle-8.10.1.bat
      - name: Check Gradle
        shell: cmd
        run: gradle --version
